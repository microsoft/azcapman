name: Validate plugin packaging

on:
  push:
    paths:
      - 'agents/**'
      - 'skills/**'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.github/plugin/**'
      - '.github/workflows/validate-plugins.yml'
  pull_request:
    paths:
      - 'agents/**'
      - 'skills/**'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.github/plugin/**'
      - '.github/workflows/validate-plugins.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Parses all five manifests, checks that the fields they share agree, confirms
      # every declared path exists, and validates agents/*.agent.md against the
      # GitHub Copilot custom agent schema.
      - name: Validate manifests and custom agents
        run: python3 .github/plugin/validate-manifests.py

      # GitHub's own validator: strict agentskills.io naming, name/directory match,
      # required frontmatter, allowed-tools type, and install-metadata stripping.
      - name: Validate skills with gh skill
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

      # Claude Code manifest validator. --strict fails on unrecognized fields and
      # missing metadata that the runtime would otherwise tolerate. Pinned rather
      # than @latest so CI never auto-executes an unreviewed new release.
      - name: Validate Claude Code plugin and marketplace manifests
        run: npx --yes @anthropic-ai/claude-code@2.1.218 plugin validate . --strict
