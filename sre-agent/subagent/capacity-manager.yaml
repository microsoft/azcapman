# Azure SRE Agent configuration format:
# https://github.com/microsoft/sre-agent/tree/main/sreagent-templates/recipes/azmon-lawappinsights/config/subagents
metadata:
  name: capacity-manager
spec:
  instructions: capacity-manager.instructions.md
  handoffDescription: >
    Handles Azure quota, quota groups, capacity reservations, region access, zonal
    enablement, capacity planning, and deployment-stamp readiness for SaaS estates.
    It separates access, quota, zone, reservation, and pricing constraints, gathers
    Azure evidence, and returns cited findings and explicit assumptions.
  handoffs: []
  tools:
    - RunAzCliReadCommands
    - RunAzCliWriteCommands
    - GetAzCliHelp
    - ExecutePythonCode
  temperature: 0.2
  enableSkills: true
  allowedSkills:
    - azure-capacity-management
